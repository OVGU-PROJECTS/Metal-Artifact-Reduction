name: ct-mar-env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8.15
  - pip
  - tensorflow=2.9.1=cuda112*
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.7
  - numpy=1.24.4
  - scipy=1.10.1
  - scikit-image=0.21.0
  - matplotlib=3.7.3
  - pyyaml=6.0.2
  - tqdm=4.66.6
  - h5py=3.9.0
  - protobuf=3.20.3
  - numba=0.58.1
  - cupy=12.0.0
  - tensorboard=2.9.0
  - pip:
      - SimpleITK==2.4.0
      - gecatsim==1.6.8
      - SQLAlchemy==1.4.54
      - optuna==2.10.1
